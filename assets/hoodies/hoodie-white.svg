<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="hoodieBg-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="hoodieShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#hoodieBg-white)"/>

  <!-- ================= TOP: FRONT VIEW ================= -->
  <g transform="translate(150, 40)" filter="url(#hoodieShadow)">
    <!-- Hood -->
    <path d="M 170,90 Q 250,20 330,90 Q 300,120 250,115 Q 200,120 170,90 Z" fill="#E4E4E7"/>
    <path d="M 210,95 Q 250,55 290,95 Q 250,105 210,95 Z" fill="#000000" opacity="0.6"/>

    <!-- Sleeves (Drop Shoulder Boxy) -->
    <path d="M 120,100 L 20,270 L 60,290 L 130,190 Z" fill="#F4F4F5"/>
    <path d="M 380,100 L 480,270 L 440,290 L 370,190 Z" fill="#F4F4F5"/>
    <!-- Ribbed Cuffs -->
    <rect x="18" y="265" width="45" height="24" rx="4" fill="#E4E4E7" transform="rotate(25 40 275)"/>
    <rect x="437" y="265" width="45" height="24" rx="4" fill="#E4E4E7" transform="rotate(-25 460 275)"/>

    <!-- Torso Body -->
    <path d="M 120,100 Q 250,125 380,100 L 370,390 L 130,390 Z" fill="#F4F4F5"/>

    <!-- Kangaroo Pocket -->
    <path d="M 175,270 L 325,270 L 345,360 L 155,360 Z" fill="#E4E4E7" stroke="#D4D4D8" stroke-width="1.5"/>
    <path d="M 155,310 Q 175,280 185,270" stroke="#D4D4D8" stroke-width="2" fill="none"/>
    <path d="M 345,310 Q 325,280 315,270" stroke="#D4D4D8" stroke-width="2" fill="none"/>

    <!-- Bottom Ribbed Hem -->
    <rect x="126" y="385" width="248" height="30" rx="4" fill="#E4E4E7"/>
  </g>

  <!-- Divider Line -->
  <line x1="200" y1="495" x2="600" y2="495" stroke="#27272A" stroke-width="1.5" stroke-dasharray="8,8"/>

  <!-- ================= BOTTOM: BACK VIEW ================= -->
  <g transform="translate(150, 520)" filter="url(#hoodieShadow)">
    <!-- Back Hood Down -->
    <path d="M 160,95 Q 250,180 340,95 Q 310,60 250,55 Q 190,60 160,95 Z" fill="#E4E4E7" stroke="#D4D4D8" stroke-width="1.5"/>
    
    <!-- Sleeves -->
    <path d="M 120,90 L 20,260 L 60,280 L 130,180 Z" fill="#F4F4F5"/>
    <path d="M 380,90 L 480,260 L 440,280 L 370,180 Z" fill="#F4F4F5"/>
    <!-- Cuffs -->
    <rect x="18" y="255" width="45" height="24" rx="4" fill="#E4E4E7" transform="rotate(25 40 265)"/>
    <rect x="437" y="255" width="45" height="24" rx="4" fill="#E4E4E7" transform="rotate(-25 460 265)"/>

    <!-- Torso Clean Back (Prime Canvas for Back Print) -->
    <path d="M 120,90 Q 250,110 380,90 L 370,380 L 130,380 Z" fill="#F4F4F5"/>

    <!-- Printable Area Guide Box (Back) -->
    <rect x="175" y="140" width="150" height="200" rx="6" fill="none" stroke="#D4D4D8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

    <!-- Bottom Ribbed Hem -->
    <rect x="126" y="375" width="248" height="30" rx="4" fill="#E4E4E7"/>
  </g>
</svg>