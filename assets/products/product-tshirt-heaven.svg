<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="700" height="850" fill="url(#studioBg)"/>
  
  <!-- Subtle Studio Grid -->
  <line x1="50" y1="50" x2="650" y2="50" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="50" y1="790" x2="650" y2="790" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- Brand Watermark -->
  <text x="350" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#71717a" text-anchor="middle" letter-spacing="6">
    KARIM ELSAYED // STREETWEAR
  </text>

  <!-- Garment Group -->
  <g transform="translate(350, 410)" filter="url(#dropShadow)">
    <!-- Garment Shadow -->
    <ellipse cx="0" cy="280" rx="220" ry="30" fill="rgba(0,0,0,0.6)" filter="blur(10px)"/>
    <!-- Boxy Oversized T-Shirt Silhouette -->
    <!-- Sleeves -->
    <path d="M -140,-240 L -260,-90 L -205,-60 L -130,-120 Z" fill="#141416" stroke="#27272a" stroke-width="2.5"/>
    <path d="M 140,-240 L 260,-90 L 205,-60 L 130,-120 Z" fill="#141416" stroke="#27272a" stroke-width="2.5"/>

    <!-- Body -->
    <path d="M -140,-240 Q 0,-215 140,-240 L 135,245 L -135,245 Z" fill="#141416" stroke="#27272a" stroke-width="2.5"/>
    
    <!-- Thick Ribbed Collar -->
    <path d="M -55,-235 C -30,-190 30,-190 55,-235" fill="none" stroke="#0a0a0d" stroke-width="9" stroke-linecap="round"/>
    <path d="M -55,-235 C -30,-190 30,-190 55,-235" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Bottom Hem -->
    <line x1="-135" y1="230" x2="135" y2="230" stroke="#0a0a0d" stroke-width="3" stroke-dasharray="4,3"/>

    <!-- Graphic Print Artwork Overlay -->
    <g transform="translate(0, -40) scale(0.6)">
      <image href="/assets/prints/heaven-flame.svg" x="-250" y="-250" width="500" height="500" preserveAspectRatio="xMidYMid meet"/>
    </g>

  </g>

  <!-- Product Info Overlay at bottom -->
  <text x="60" y="770" font-family="'Cairo', sans-serif" font-size="24" font-weight="800" fill="#ffffff">تيشيرت أوفر سايز "HEAVEN" فليم قوطي</text>
  <text x="60" y="800" font-family="'Cairo', sans-serif" font-size="15" font-weight="500" fill="#a1a1aa">تيشيرتات أوفر سايز • قطن مصري 100% ثقيل</text>
  <rect x="510" y="755" width="130" height="36" rx="18" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="575" y="778" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">إصدار رسمي</text>
</svg>