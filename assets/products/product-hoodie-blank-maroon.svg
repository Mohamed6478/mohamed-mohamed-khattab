<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="700" height="850" fill="url(#studioBg)"/>
  
  <!-- Subtle Studio Grid -->
  <line x1="50" y1="50" x2="650" y2="50" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="50" y1="790" x2="650" y2="790" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- Brand Watermark -->
  <text x="350" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#71717a" text-anchor="middle" letter-spacing="6">
    KARIM ELSAYED // STREETWEAR
  </text>

  <!-- Garment Group -->
  <g transform="translate(350, 410)" filter="url(#dropShadow)">
    <!-- Garment Shadow -->
    <ellipse cx="0" cy="280" rx="220" ry="30" fill="rgba(0,0,0,0.6)" filter="blur(10px)"/>
    <!-- Heavyweight Hoodie Silhouette -->
    <!-- Hood -->
    <path d="M -85,-270 Q 0,-340 85,-270 Q 60,-240 0,-245 Q -60,-240 -85,-270 Z" fill="#d4d4d8" stroke="#a1a1aa" stroke-width="2"/>
    <path d="M -45,-265 Q 0,-305 45,-265 Q 0,-255 -45,-265 Z" fill="#000000" opacity="0.7"/>

    <!-- Sleeves Drop Shoulder -->
    <path d="M -150,-240 L -270,-40 L -215,-15 L -130,-120 Z" fill="#581c28" stroke="#a1a1aa" stroke-width="2.5"/>
    <path d="M 150,-240 L 270,-40 L 215,-15 L 130,-120 Z" fill="#581c28" stroke="#a1a1aa" stroke-width="2.5"/>
    <!-- Cuffs -->
    <rect x="-275" y="-50" width="65" height="30" rx="6" fill="#d4d4d8" transform="rotate(35 -245 -35)"/>
    <rect x="210" y="-50" width="65" height="30" rx="6" fill="#d4d4d8" transform="rotate(-35 245 -35)"/>

    <!-- Torso Body -->
    <path d="M -150,-240 Q 0,-210 150,-240 L 140,240 L -140,240 Z" fill="#581c28" stroke="#a1a1aa" stroke-width="2.5"/>

    <!-- Kangaroo Pocket -->
    <path d="M -90,70 L 90,70 L 115,200 L -115,200 Z" fill="#d4d4d8" stroke="#a1a1aa" stroke-width="2"/>
    <path d="M -115,130 Q -90,80 -80,70" stroke="#a1a1aa" stroke-width="2" fill="none"/>
    <path d="M 115,130 Q 90,80 80,70" stroke="#a1a1aa" stroke-width="2" fill="none"/>

    <!-- Ribbed Bottom Hem -->
    <rect x="-142" y="235" width="284" height="35" rx="5" fill="#d4d4d8" stroke="#a1a1aa" stroke-width="1.5"/>

  </g>

  <!-- Product Info Overlay at bottom -->
  <text x="60" y="770" font-family="'Cairo', sans-serif" font-size="24" font-weight="800" fill="#ffffff">هودي بلانك أوفر سايز عنابي مارون</text>
  <text x="60" y="800" font-family="'Cairo', sans-serif" font-size="15" font-weight="500" fill="#a1a1aa">هوديز • قطن مصري 100% ثقيل</text>
  <rect x="510" y="755" width="130" height="36" rx="18" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="575" y="778" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">إصدار رسمي</text>
</svg>